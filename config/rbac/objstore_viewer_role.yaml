# This rule is not used by the project mycninf itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to mycninf.test.erwanleblond.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mycninf
    app.kubernetes.io/managed-by: kustomize
  name: objstore-viewer-role
rules:
- apiGroups:
  - mycninf.test.erwanleblond.com
  resources:
  - objstores
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - mycninf.test.erwanleblond.com
  resources:
  - objstores/status
  verbs:
  - get
